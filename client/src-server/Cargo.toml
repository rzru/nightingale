[package]
name = "server"
version = "1.3.0"
description = "Nightingale self-hosted web server."
authors = ["rzru <rzzzzru@gmail.com>"]
license = "GPL-3.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[lib]
name = "server"
path = "src/lib.rs"

[dependencies]
app-api = { path = "../../app-api" }
app-core = { path = "../../app-core" }

axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "signal",
  "fs",
  "io-util",
] }
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = { version = "8", features = ["compression"] }
mime_guess = "2"
percent-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
once_cell = "1"
dotenvy = "0.15"
base64 = "0.22"

[lints]
workspace = true
