[package]
name = "app-core"
version = "1.2.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
walkdir = "2"
blake3 = "1"
lofty = "0.23"
ureq = { version = "3", features = ["json"] }
urlencoding = "2"
rand = "0.9"
tiny_http = "0.12.0"
tracing = "0.1"
diesel = { version = "~2.2.12", features = ["sqlite", "serde_json"] }
libsqlite3-sys = { version = "0.35.0", features = ["bundled"] }
url = "2"
chacha20poly1305 = "0.10"
base64 = "0.22"
md-5 = "0.10"
zip = { version = "4", default-features = false }
unicode-normalization = "0.1"

[build-dependencies]
dotenvy = "0.15"

[lints]
workspace = true
